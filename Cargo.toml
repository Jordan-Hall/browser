[workspace]
members = [
    "crates/intent-contracts",
    "crates/intent-ipc",
    "crates/intent-local-transport",
    "crates/intent-fixture-worker",
    "crates/intent-conformance",
    "crates/intent-state",
    "crates/intent-broker",
    "crates/intent-recovery",
    "crates/intent-supervisor",
    "crates/intent-xtask",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
getrandom = "0.3.3"
hmac = "0.12.1"
nix = { version = "0.31.3", default-features = false, features = ["socket", "user", "fs", "dir", "signal", "process", "resource"] }
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
uuid = { version = "1.20.0", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
