name: Import verified CORE checkpoint source

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/core-checkpoint-import.part*'
      - '.github/workflows/core-checkpoint-import.yml'

permissions:
  contents: read

jobs:
  import:
    if: >-
      github.event.pull_request.head.repo.full_name == 'Jordan-Hall/browser' &&
      github.event.pull_request.head.ref == 'core-04-t02-checkpoints-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact isolated PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify and import authored source without executing it
        shell: bash
        run: |
          set -euo pipefail
          cat .github/core-checkpoint-import.part{01,02,03,04,05} | base64 --decode > /tmp/core-checkpoint.patch.xz
          echo '83e35184594ae8c3814428a6acab28a9dfc50e95246dfda1d279c0a135f509ea  /tmp/core-checkpoint.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/core-checkpoint.patch.xz > /tmp/core-checkpoint.patch
          echo '9ba655eb8daa2f7d6f77b8687abea59df3351ed5347f7c559ca26916b934cc37  /tmp/core-checkpoint.patch' | sha256sum --check
          git apply --check --whitespace=error /tmp/core-checkpoint.patch
          git apply --whitespace=error /tmp/core-checkpoint.patch
          git add -- crates docs scripts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(core-04): persist consistent task checkpoints and authenticated restore upgrades'

      - name: Record actual publication identity without asserting acceptance
        env:
          IMPLEMENTATION_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pr = int(os.environ['IMPLEMENTATION_PR'])
          assert pr > 0
          commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          path = Path('docs/core-task-coverage.json')
          data = json.loads(path.read_text())
          for task in data['tasks']:
              pending = [e for e in task.get('implementation_evidence', []) if e['publication'] == 'unpublished']
              if pending:
                  for evidence in pending:
                      evidence['publication'] = 'published'
                      evidence['commit'] = commit
                  if pr not in task['implementation_prs']:
                      task['implementation_prs'].append(pr)
              if task['issue'] == 146:
                  task['status'] = 'implemented_pending_acceptance'
                  task['remaining'] = 'Checkpoint storage, CAS graph revision, dependency verification, retention ownership and process-interruption regressions are published; live runtime graph integration and independent whole-task acceptance remain open.'
          path.write_text(json.dumps(data, indent=2)+'\n')
          path = Path('docs/core-task-coverage.md')
          text = path.read_text().replace('New checkpoint code is identified separately until its PR is published.', f'Checkpoint implementation is published in #{pr}; publication does not establish acceptance.')
          lines = text.splitlines()
          for index, line in enumerate(lines):
              if line.startswith('| CORE-') or line.startswith('| PROGRAMME.') or line.startswith('| EPIC-CORE.'):
                  cells = line.split('|')
                  issue = int(cells[2].strip()[1:])
                  task = next(t for t in data['tasks'] if t['issue'] == issue)
                  cells[3] = ' ' + (' '.join('#'+str(n) for n in task['implementation_prs']) or 'None') + ' '
                  cells[4] = ' ' + task['status'] + ' '
                  cells[5] = ' ' + task['remaining'] + ' '
                  lines[index] = '|'.join(cells)
          path.write_text('\n'.join(lines)+'\n')
          path = Path('docs/core-checkpoints.md')
          path.write_text(path.read_text()+f'\nPublication: PR #{pr}; initial source commit `{commit}`. Remote source CI is recorded in the PR after it actually executes.\n')
          PY
          git add -- docs
          git diff --cached --check
          git commit -m 'docs(core): record checkpoint PR and published supervisor evidence'

      - name: Publish only this isolated branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/core-04-t02-checkpoints-20260918
