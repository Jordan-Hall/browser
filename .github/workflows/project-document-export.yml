name: Project issue document archive

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'scripts/export_project_archive.py'
      - '.github/workflows/project-document-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == 'Jordan-Hall/browser' &&
      github.event.pull_request.head.ref == 'docs/project-issue-archive-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Check out exact documentation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Permit the same repository canonical numeric pagination URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/export_project_archive.py')
          source = path.read_text()
          old = '    if not url.startswith(BASE):'
          new = '    if not (url.lower().startswith(BASE.lower()) or url.startswith("https://api.github.com/repositories/1371315992/")):'
          if old not in source and new not in source:
              raise ValueError('Unexpected exporter source')
          path.write_text(source.replace(old, new))
          PY
      - name: Export full issues and comments with coverage checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/export_project_archive.py
      - name: Commit generated documents and canonical-pagination fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- docs/project-archive scripts/export_project_archive.py
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: snapshot every issue, epic and conversation for project context'
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/docs/project-issue-archive-20260918
      - name: Upload complete document library
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-project-documents-${{ github.run_id }}
          path: docs/project-archive/
          if-no-files-found: error
          retention-days: 30
