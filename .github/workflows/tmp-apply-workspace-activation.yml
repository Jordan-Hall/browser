name: Temporary apply workspace activation

on:
  push:
    branches:
      - core/core-document-workspace-activation-20260919
    paths:
      - .github/workflows/tmp-apply-workspace-activation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: core/core-document-workspace-activation-20260919
          persist-credentials: true
      - name: Apply reviewed local implementation patches
        shell: bash
        run: |
          set -euo pipefail
          git apply scripts/tmp-workspace-activation/01-contracts.patch
          git apply scripts/tmp-workspace-activation/02-workspace-state.patch
          git apply scripts/tmp-workspace-activation/03-runtime-fence.patch
          git apply scripts/tmp-workspace-activation/04-broker.patch
      - name: Install pinned Rust and verify implementation
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(python3 scripts/rust_toolchain.py --channel)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$TOOLCHAIN"
          python3 scripts/rust_toolchain.py --verify-active
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p intent-broker --test workspace_activation --no-fail-fast
      - name: Commit implementation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/intent-contracts/src/records/state_accessors.rs \
                  crates/intent-state/src/workspace_checkpoints.rs \
                  crates/intent-state/src/durable_recovery/mod.rs \
                  crates/intent-broker/src/record_import.rs
          git commit -m "CORE-01.T06: activate validated workspace archives under startup fence"
          git push origin HEAD:core/core-document-workspace-activation-20260919
