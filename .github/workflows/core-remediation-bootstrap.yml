name: Apply reviewed CORE remediation

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/core-remediation.patch.xz.part*'
      - '.github/workflows/core-remediation-bootstrap.yml'

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 802 &&
      github.event.pull_request.head.repo.full_name == 'Jordan-Hall/browser' &&
      github.event.pull_request.head.ref == 'core/production-hardening-20260917'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact remediation head without persistent credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and apply authored source patch
        run: |
          set -euo pipefail
          cat .github/core-remediation.patch.xz.part{1,2,3,4} > /tmp/core-remediation.patch.xz
          echo 'c4fb8c0e2b8586ee0f770a925e1538da2938c8126bcebfdeb07a8a70d0e877cc  /tmp/core-remediation.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/core-remediation.patch.xz > /tmp/core-remediation.patch
          echo '3430ff59ce7f4bb17f7d78d2305455c02747c31260fbe4910ef41ce98d0c3178  /tmp/core-remediation.patch' | sha256sum --check
          git apply --check --unidiff-zero --whitespace=error /tmp/core-remediation.patch
          git apply --unidiff-zero --whitespace=error /tmp/core-remediation.patch

      - name: Format sources and resolve exact dependency inputs
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          cargo fmt --all
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path fuzz/Cargo.toml
          git add -- crates docs/core-production-readiness.md Cargo.lock fuzz/Cargo.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(core): enforce boundary invariants and serialized artifact lifecycle'
          mkdir -p target/bootstrap
          git rev-parse HEAD > target/bootstrap/head.txt
          git archive --format=tar -o target/bootstrap/source.tar HEAD

      - name: Publish only to the isolated remediation branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/core/production-hardening-20260917

      - name: Retain generated source for verification
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-remediation-source-${{ github.run_id }}
          path: target/bootstrap/
          if-no-files-found: warn
          retention-days: 2
