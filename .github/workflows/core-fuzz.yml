name: CORE parser fuzzing

on:
  pull_request:
    paths:
      - 'crates/intent-contracts/**'
      - 'crates/intent-ipc/**'
      - 'fixtures/core/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/fuzz_smoke.py'
      - 'scripts/tests/test_fuzz_smoke.py'
      - '.github/workflows/core-fuzz.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [frame_decoder, control_envelope, record_codec]
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned fuzz tools
        id: tools
        run: |
          rustup toolchain install nightly-2026-09-17 --profile minimal
          cargo +nightly-2026-09-17 install cargo-fuzz --version 0.13.2 --locked
      - name: Fetch exact dependency inputs
        id: dependencies
        run: |
          cargo +nightly-2026-09-17 fetch --locked --manifest-path fuzz/Cargo.toml --target x86_64-unknown-linux-gnu
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - name: Build and run instrumented target
        id: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: python3 scripts/fuzz_smoke.py "$FUZZ_TARGET"
      - name: Retain job outcomes
        id: outcomes
        if: ${{ always() }}
        env:
          JOB_STEPS: ${{ toJSON(steps) }}
        run: |
          mkdir -p target/fuzz-evidence
          printf '%s\n' "$JOB_STEPS" > target/fuzz-evidence/job-steps.json
      - name: Upload fuzz logs, corpus and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/fuzz-evidence/
          if-no-files-found: error
          retention-days: 14
