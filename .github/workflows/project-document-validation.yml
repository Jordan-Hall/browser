name: Validate project document archive

on:
  pull_request:
    paths:
      - 'docs/project-archive/**'
      - 'scripts/*project_archive.py'
      - '.github/workflows/project-document-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify issue coverage, exact text and document checksums
        run: python3 scripts/validate_project_archive.py
