name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Check architecture boundaries
        run: cargo run -p intent-xtask -- arch-check

      - name: Run core contract conformance
        run: |
          mkdir -p target/conformance
          cargo run -p intent-conformance --quiet > target/conformance/core-contracts.json

      - name: Upload core conformance report
        uses: actions/upload-artifact@v4
        with:
          name: core-contract-conformance
          path: target/conformance/core-contracts.json
          if-no-files-found: error
          retention-days: 14
