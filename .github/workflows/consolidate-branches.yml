name: Build branch consolidation candidate
on:
  push:
    branches: [maintenance/consolidate-20260918]
    paths: [.github/workflows/consolidate-branches.yml]
permissions:
  contents: read
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Merge reviewed source without executing application code
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Jordan-Hall/browser.git work
          cd work
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach "$GITHUB_SHA"
          python3 - <<'PY'
          import copy, json, os, re, subprocess
          from pathlib import Path
          MAIN = '93bc1291457f3a3bc8250be76d5bda4d3e1f589b'
          CHECKPOINT = '845e808324b4c6f189e0ad880c5b164e43215376'
          VALIDATION = '317d7dafe2002effe66cf4bdc48ab99d91cceb22'
          SUPERVISOR = '4240339a7619f3a9cd7aee4cab3fd01ca74f3b8a'
          def git(*args, check=True):
              result = subprocess.run(['git', *args], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if check and result.returncode:
                  raise RuntimeError(str(args)+'\n'+result.stdout)
              return result
          def source(ref, path):
              return git('show', ref+':'+path).stdout
          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text)
          def commit(message):
              git('add', '-A')
              if git('diff', '--name-only', '--diff-filter=U').stdout.strip():
                  raise RuntimeError('Unresolved merge entries')
              git('diff', '--cached', '--check')
              git('commit', '-m', message)
          assert git('rev-parse', 'origin/main').stdout.strip() == MAIN, 'main moved; re-audit required'
          inventory = json.loads(Path('consolidation-audit.json').read_text())['branches']
          checkpoint_paths = {
              'crates/intent-state/src/checkpoints.rs': 'crates/intent-state/src/workspace_checkpoints.rs',
              'crates/intent-state/src/checkpoints/tests.rs': 'crates/intent-state/src/workspace_checkpoints/tests.rs',
              'crates/intent-state/src/checkpoints/types.rs': 'crates/intent-state/src/workspace_checkpoints/types.rs',
              'crates/intent-state/src/checkpoints/migration.sql': 'crates/intent-state/src/workspace_checkpoints/migration.sql',
          }
          def ledger(ref, relocate=False):
              data = json.loads(source(ref, 'docs/core-task-coverage.json'))
              if relocate:
                  for task in data['tasks']:
                      for evidence in task.get('implementation_evidence', []):
                          evidence['source_files'] = [checkpoint_paths.get(p, p) for p in evidence.get('source_files', [])]
              return data
          def merge_ledger(old, new):
              data = copy.deepcopy(new)
              previous = {t['issue']: t for t in old['tasks']}
              for task in data['tasks']:
                  before = previous[task['issue']]
                  task['implementation_prs'] = sorted(set(task['implementation_prs'] + before['implementation_prs']))
                  evidence = task.get('implementation_evidence', [])
                  for entry in before.get('implementation_evidence', []):
                      if entry not in evidence:
                          evidence.append(entry)
                  task['implementation_evidence'] = evidence
                  assert task['status'] != 'accepted'
                  if task['issue'] == 146:
                      task['remaining'] = 'Task checkpoints (#808) and runtime-owned workspace checkpoints (#806) are both preserved with separate APIs and migrations. Live graph integration, independent whole-task acceptance and platform/power-loss qualification remain open.'
              data['production_ready'] = False
              return data
          def write_ledger(data, template):
              write('docs/core-task-coverage.json', json.dumps(data, indent=2)+'\n')
              tasks = {t['issue']: t for t in data['tasks']}
              lines = template.splitlines()
              for n, line in enumerate(lines):
                  if line.startswith(('| CORE-', '| PROGRAMME.', '| EPIC-CORE.')):
                      cells = line.split('|')
                      task = tasks[int(cells[2].strip()[1:])]
                      cells[3] = ' '+(' '.join('#'+str(pr) for pr in task['implementation_prs']) or 'None')+' '
                      cells[4] = ' '+task['status']+' '
                      cells[5] = ' '+task['remaining']+' '
                      lines[n] = '|'.join(cells)
              lines += ['', '## Branch consolidation', '', 'Both task and workspace checkpoint implementations are retained. See `docs/branch-consolidation-20260918.md`. Merging unfinished work does not establish acceptance or production readiness.']
              write('docs/core-task-coverage.md', '\n'.join(lines)+'\n')
          result = git('merge', '--no-commit', '--no-ff', CHECKPOINT, check=False)
          expected = {'crates/intent-state/src/checkpoints.rs', 'crates/intent-state/src/checkpoints/tests.rs', 'crates/intent-state/src/hardening_tests.rs', 'crates/intent-state/src/lib.rs', 'crates/intent-state/src/migrations.rs', 'docs/core-task-coverage.json', 'docs/core-task-coverage.md', 'scripts/tests/test_core_coverage.py'}
          assert set(git('diff', '--name-only', '--diff-filter=U').stdout.splitlines()) == expected, result.stdout
          for old, new in checkpoint_paths.items():
              text = source(CHECKPOINT, old)
              if old.endswith('/tests.rs'):
                  text = text.replace('checkpoints::tests::', 'workspace_checkpoints::tests::')
              write(new, text)
          for path in ['crates/intent-state/src/checkpoints.rs', 'crates/intent-state/src/checkpoints/tests.rs']:
              write(path, source(MAIN, path))
          for path in ['crates/intent-state/src/checkpoints/types.rs', 'crates/intent-state/src/checkpoints/migration.sql']:
              Path(path).unlink()
          lib = source(MAIN, 'crates/intent-state/src/lib.rs')
          extra = '''mod recovery_error;
          pub use recovery_error::RecoveryError;
          #[cfg(all(target_os = "linux", target_env = "gnu"))]
          mod durable_recovery;
          #[cfg(all(target_os = "linux", target_env = "gnu"))]
          pub use durable_recovery::*;
          #[cfg(all(target_os = "linux", target_env = "gnu"))]
          pub mod workspace_checkpoints;
          #[cfg(all(target_os = "linux", target_env = "gnu"))]
          pub use workspace_checkpoints::{
              CheckpointError as WorkspaceCheckpointError, CheckpointId as WorkspaceCheckpointId,
              CheckpointRequest as WorkspaceCheckpointRequest,
          };
          '''
          lib = lib.replace('mod artifacts;\n', 'mod artifacts;\n'+extra, 1)
          lib = re.sub(r'(schema_version\(\)\?, )8(\))', r'\g<1>10\2', lib)
          write('crates/intent-state/src/lib.rs', lib)
          hardening = source(MAIN, 'crates/intent-state/src/hardening_tests.rs').replace('ledger_version: 8', 'ledger_version: 10').replace('        8\n    );', '        10\n    );')
          write('crates/intent-state/src/hardening_tests.rs', hardening)
          migrations = source(MAIN, 'crates/intent-state/src/migrations.rs')
          migrations = migrations.replace('const MIGRATION_008: &str = include_str!("checkpoints/schema.sql");', 'const MIGRATION_008: &str = include_str!("checkpoints/schema.sql");\nconst MIGRATION_009: &str = include_str!("workspace_checkpoints/migration.sql");\nconst MIGRATION_010: &str = include_str!("durable_recovery/migration.sql");')
          anchor = '        name: "consistent_task_checkpoints",\n        sql: MIGRATION_008,\n    },\n'
          assert migrations.count(anchor) == 1
          migrations = migrations.replace(anchor, anchor+'''    Migration {
                  version: 9,
                  name: "consistent_workspace_checkpoints",
                  sql: MIGRATION_009,
              },
              Migration {
                  version: 10,
                  name: "durable_recovery_authority",
                  sql: MIGRATION_010,
              },
          ''')
          write('crates/intent-state/src/migrations.rs', migrations)
          write('scripts/tests/test_core_coverage.py', source(VALIDATION, 'scripts/tests/test_core_coverage.py'))
          data = merge_ledger(ledger(MAIN), ledger(CHECKPOINT, True))
          write_ledger(data, source(CHECKPOINT, 'docs/core-task-coverage.md'))
          commit('Merge #806: retain task and workspace checkpoints with separate APIs and immutable migration 008')
          previous = copy.deepcopy(data)
          result = git('merge', '--no-commit', '--no-ff', VALIDATION, check=False)
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').stdout.splitlines())
          assert conflicts <= {'docs/core-task-coverage.json', 'docs/core-task-coverage.md'}, result.stdout
          data = merge_ledger(previous, ledger(VALIDATION, True))
          write_ledger(data, source(VALIDATION, 'docs/core-task-coverage.md'))
          commit('Merge #813: retain record validation, parser fuzzing and all checkpoint evidence')
          result = git('merge', '--no-ff', '-m', 'Preserve superseded supervisor transport branch history', SUPERVISOR, check=False)
          assert result.returncode == 0, result.stdout
          for row in inventory:
              assert git('merge-base', '--is-ancestor', row['sha'], 'HEAD', check=False).returncode == 0, 'Unmerged branch: '+row['branch']
          for path in Path('crates/intent-state/src').rglob('*.rs'):
              text = path.read_text()
              text = re.sub(r'(schema_version\(\)\?, )[89](\))', r'\g<1>10\2', text)
              path.write_text(text)
          for path in git('ls-files', '.github').stdout.splitlines():
              name = Path(path).name
              if (name.startswith('core-checkpoint-import.part') or name.startswith('core-supervisor.patch.xz.part') or name in {'core-checkpoint-import.yml', 'core-supervisor-import.yml', 'consolidate-branches.yml'}):
                  Path(path).unlink()
          for path in ['consolidation-audit.json', 'consolidation-conflicts.diff']:
              Path(path).unlink()
          report = '''# Branch consolidation — 18 September 2026

          The default branch is `main`; no `master` branch existed. The owner requested consolidation of all implementation branches, including incomplete work.

          ## Checkpoint conflict resolution

          PR #806 and PR #808 contain different, useful checkpoint APIs, not duplicate implementations. Both remain compiled and tested: existing task checkpoints keep their root API and `checkpoints` module; workspace checkpoints are exposed under `intent_state::workspace_checkpoints`, with `WorkspaceCheckpointRequest`, `WorkspaceCheckpointId` and `WorkspaceCheckpointError` aliases. Neither implementation or its regression suite was discarded.

          Canonical migrations 001–008 are unchanged, including the task-checkpoint migration already on main. Workspace checkpoints are appended as migration 009 and durable recovery as migration 010. Task and workspace pins use separate reference kinds. Databases created on the formerly unmerged workspace-checkpoint branch have a divergent migration-008 checksum and are intentionally rejected, not silently reinterpreted; retain those original databases until an explicit export/import migration is designed.

          Record validation, broker dispatch, durable recovery, supervision and existing documentation are retained. Implementation evidence from both stacks is preserved; no task is promoted to accepted. Obsolete checksum-transport payloads/workflows are removed from the working tree only after their source branches are incorporated into ancestry. They remain recoverable from Git history.

          ## Preserved branch tips

          Every tip below was verified as an ancestor of this candidate before publication. Branch deletion is a separate, expected-SHA-guarded step after the candidate has passed CI and reached main.

          | Branch | Original tip |
          | --- | --- |
          '''
          report = '\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines())+'\n'
          report += ''.join('| `'+r['branch']+'` | `'+r['sha']+'` |\n' for r in inventory)
          write('docs/branch-consolidation-20260918.md', report)
          commit('chore: document consolidated ancestry and remove consumed source-import transports')
          PY
      - name: Format only; application verification runs separately with read-only permissions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cd work
          cargo +1.98.1 fmt --all
          git add -- crates
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'style: format consolidated module exports and migrations'
          fi
      - name: Publish candidate only to the isolated maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/maintenance/consolidate-20260918
