name: Import verified CORE recovery implementation

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/core-recovery.patch.xz'
      - '.github/workflows/core-recovery-import.yml'

permissions:
  contents: read

jobs:
  import:
    if: >-
      github.event.pull_request.head.repo.full_name == 'Jordan-Hall/browser' &&
      github.event.pull_request.head.ref == 'core-04-recovery-policy-and-replay'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact isolated implementation head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and apply the locally tested source patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4fface918d13be0f636bd7b0a3716aedb9b08eb4 HEAD
          echo '19dfd6403fea393b94037eb633bc8cca046c748a938da123272a16cbe950fbc8  .github/core-recovery.patch.xz' | sha256sum --check
          xz --decompress --stdout .github/core-recovery.patch.xz > /tmp/core-recovery.patch
          echo '8192c08a6d43419e37fb088067dc98c56c321826a9c35f6f9a8d47daca8df39f  /tmp/core-recovery.patch' | sha256sum --check
          git apply --check --whitespace=error /tmp/core-recovery.patch
          git apply --whitespace=error /tmp/core-recovery.patch
          git add -- Cargo.toml Cargo.lock crates/intent-recovery docs/core-recovery-policy.md
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'Cargo.toml', 'Cargo.lock', 'crates/intent-recovery/Cargo.toml',
              'crates/intent-recovery/src/lib.rs',
              'crates/intent-recovery/src/policy.rs',
              'crates/intent-recovery/src/provider.rs',
              'crates/intent-recovery/src/registry.rs',
              'crates/intent-recovery/src/replay.rs',
              'crates/intent-recovery/tests/recovery_policy.rs',
              'crates/intent-recovery/tests/replay_and_provider.rs',
              'docs/core-recovery-policy.md',
          }
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0'))
          if paths != expected:
              raise SystemExit(f'unexpected staged paths: {paths ^ expected}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(core): deterministic recovery policy and captured-only replay' -m 'Refs #145 #149 #150; production integration and full CORE acceptance remain open.'

      - name: Publish only the isolated feature branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/core-04-recovery-policy-and-replay
