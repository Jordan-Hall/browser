name: Import verified CORE supervisor source

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/core-supervisor-import.part*'
      - '.github/workflows/core-supervisor-import.yml'

permissions:
  contents: read

jobs:
  import:
    if: >-
      github.event.pull_request.head.repo.full_name == 'Jordan-Hall/browser' &&
      github.event.pull_request.head.ref == 'core-03-supervision-acceptance-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact isolated PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify and import authored source without executing it
        shell: bash
        run: |
          set -euo pipefail
          cat .github/core-supervisor-import.part{01,02,03,04,05,06,07,08,09} | base64 --decode > /tmp/core-supervisor.patch.xz
          echo 'a0e7ffc8b5fbff9b2277ca6e2e4205c3686f70ff0ba4b1d909f1f7441ec2f93e  /tmp/core-supervisor.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/core-supervisor.patch.xz > /tmp/core-supervisor.patch
          echo 'f9d16dce979cb29c18d769a28d011b3637c2caf11ba29f648e5e51f5473241bf  /tmp/core-supervisor.patch' | sha256sum --check
          git apply --check --whitespace=error /tmp/core-supervisor.patch
          git apply --whitespace=error /tmp/core-supervisor.patch
          git add -- Cargo.toml Cargo.lock crates docs scripts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(core): publish bounded Linux supervision and acceptance regressions'

      - name: Publish only to the isolated PR branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/core-03-supervision-acceptance-20260918
