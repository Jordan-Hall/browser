name: Import verified CORE broker source

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/core-broker-source.patch.xz.part*'
      - '.github/workflows/core-broker-source-import.yml'

permissions:
  contents: read

jobs:
  import:
    if: >-
      github.event.pull_request.number == 809 &&
      github.event.pull_request.head.repo.full_name == 'Jordan-Hall/browser' &&
      github.event.pull_request.head.ref == 'core-broker-supervisor-dispatch-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact isolated head without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source hashes and tree before importing without execution
        env:
          CHECKED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_HEAD"
          cat .github/core-broker-source.patch.xz.part{1,2,3,4} > /tmp/core-broker.patch.xz
          echo '605ff4f834bd2fae47069ca26cc0a37bdb756454ec5435c7bd2e7d38110ccfad  /tmp/core-broker.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/core-broker.patch.xz > /tmp/core-broker.patch
          echo 'a675f1fdfc54786929ec58ed7b88c8e16f8722cb81cee1972ed0c20c5be5353c  /tmp/core-broker.patch' | sha256sum --check
          export GIT_INDEX_FILE=/tmp/core-broker-verify-index
          git read-tree 420dbced30ad591f333f5c1fc25ac62f84479031
          git apply --cached --whitespace=error /tmp/core-broker.patch
          test "$(git write-tree)" = '077fc3bf31e08045ec023fb9e7fc5ee29a580600'
          unset GIT_INDEX_FILE
          git apply --check --whitespace=error /tmp/core-broker.patch
          git apply --whitespace=error /tmp/core-broker.patch
          git add -- Cargo.toml Cargo.lock crates docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(core): integrate durable authorization and authenticated worker dispatch'
          git show --no-patch --format=fuller HEAD

      - name: Publish only the isolated branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push origin HEAD:refs/heads/core-broker-supervisor-dispatch-20260918
